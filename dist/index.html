}

.ico{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* ── Cabecera ─────────────────────────────────────────
   Emblema, buscador y rótulo en un solo bloque fijo. Es lo único que
   permanece siempre en pantalla, así que se comprime al máximo. */
.head{
  position:sticky;top:0;z-index:10;background:var(--bg);
  padding-top:env(safe-area-inset-top);
  border-bottom:1px solid var(--border);
}
.bar{
  display:flex;align-items:center;gap:12px;
  padding:9px var(--pad);
}
/* El emblema abarca de alto el buscador más el rótulo. A este tamaño su
   texto curvo no es legible ni pretende serlo: funciona como distintivo. */
.bar .mark{flex:none;width:70px;height:70px;display:block}
.stack{flex:1;min-width:0}
.sub{
  margin:3px 0 0;padding:0 2px;
  font-size:10.5px;font-weight:500;letter-spacing:.17em;text-transform:uppercase;
  color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ── Buscador ─────────────────────────────────────── */
.field{
  position:relative;display:flex;align-items:center;
  background:var(--field);
  border:1px solid var(--border);border-radius:10px;
}
.field:focus-within{border-color:var(--accent)}
.field .ico.lead{
  position:absolute;left:14px;width:19px;height:19px;
  color:var(--icon);pointer-events:none;
}
.field:focus-within .ico.lead{color:var(--accent)}
#q{
  display:block;width:100%;height:52px;
  padding:0 52px 0 43px;
  background:none;border:0;outline:none;border-radius:10px;
  font-family:inherit;font-size:19px;font-weight:500;color:var(--text);
  letter-spacing:.01em;
}
#clear{
  position:absolute;right:2px;
  width:48px;height:48px;display:none;place-items:center;
  background:none;border:0;padding:0;color:var(--icon);cursor:pointer;
}
#clear .ico{width:18px;height:18px}
#clear:active{color:var(--text)}
body.has-query #clear{display:grid}

/* El recuento no se muestra: no aporta nada durante un aviso. Se mantiene
   solo como región activa para lectores de pantalla, que sí necesitan saber
   cuántos resultados ha dejado el filtro. */
.sr{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

/* ── Filas ────────────────────────────────────────── */
ul{list-style:none;margin:0;padding:0}

/* La fila NO es pulsable. Solo lo es el botón de la derecha: durante el
   desplazamiento con el dedo, una fila-enlace de 42 px se activa sin querer
   y lanza el GPS hacia una caseta equivocada. */
.row{
  display:flex;align-items:center;
  height:var(--row);padding:0 0 0 var(--pad);
  border-bottom:1px solid var(--rule);
  /* Sin selección de texto: al desplazar la lista con el dedo, el arrastre
     seleccionaba nombres y dejaba la pantalla llena de resaltes azules. */
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}

/* Ancho fijo: los nombres deben alinearse en columna aunque el número
   sea "3" o "180–186". 80px cubre la etiqueta más larga posible. */
/* Un único estilo para la columna: 192, 180–186, S/N y 169BIS se ven igual.
   La etiqueta es siempre el identificador de la ubicación, tenga número o no. */
.num{
  flex:none;width:80px;padding-right:8px;
  font-size:15px;font-weight:700;
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
  color:var(--accent);
}

.nom{
  flex:1;min-width:0;
  font-size:16.5px;font-weight:500;letter-spacing:.005em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* Botón de navegar. Ocupa toda la altura de la fila y 64 px de ancho:
   el objetivo real es mayor que la píldora que se ve. */
.go{
  flex:none;width:64px;align-self:stretch;
  display:grid;place-items:center;
  border-left:1px solid var(--rule);
  color:var(--accent);text-decoration:none;
}
.go .pill{
  display:grid;place-items:center;
  width:36px;height:28px;border-radius:8px;
  background:rgba(255,199,44,.10);
  border:1px solid rgba(255,199,44,.32);
}
.go .nav{width:17px;height:17px;stroke-width:2}
.go:active .pill{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.go:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}

/* ── Sin resultados ───────────────────────────────── */
.none{display:none;padding:24px var(--pad);color:var(--muted);font-size:13.5px}
.none b{display:block;color:var(--text);font-size:15px;font-weight:500;margin-bottom:5px}
body.no-results .none{display:block}
body.no-results ul{display:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:600px){
  .bar,ul,.none{max-width:560px;margin-inline:auto}
  ul,.none{border-inline:1px solid var(--rule)}
}
</style>
</head>

const MAPS = 'https://www.google.com/maps/dir/?api=1&destination=';
/* lucide · navigation — mismo grosor de trazo que el resto de iconos */
const NAV_PATH = 'M3.5 11.2 21.4 2.6l-8.6 17.9-1.9-7.4-7.4-1.9z';
const NS = 'http://www.w3.org/2000/svg';

const q = document.getElementById('q');
const list = document.getElementById('list');
const meta = document.getElementById('meta');
const body = document.body;

/** Minúsculas, sin tildes, comillas normalizadas, espacios colapsados. */
function normalize(s){
  return s.toLowerCase()
    .replace(/[‘’]/g, "'")
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, ' ').trim();
}

function mapsUrl(loc){
  return MAPS + loc.lat + ',' + loc.lon + '&travelmode=driving&dir_action=navigate';
}

/**
 * Filtra y ordena. Dentro de cada grupo se conserva el orden de data.md.
 *
 * Consulta numérica  → número exacto > número que empieza por > nombre que contiene.
 *   Nunca coincidencia de subcadena sobre el número: escribir 39 no puede
 *   devolver la caseta 139. Mandar la unidad a la caseta equivocada es el
 *   único fallo grave posible en esta app.
 * Consulta de texto  → nombre que empieza por > nombre que contiene.
 */
function search(raw){
  const term = normalize(raw);
  if (!term) return LOCATIONS;

  const exact = [], prefix = [], contains = [];

  if (/^\d+$/.test(term)){
    const num = parseInt(term, 10);
    for (const loc of LOCATIONS){
      if (loc.numbers.includes(num)) exact.push(loc);
      else if (loc.numbers.some(n => String(n).startsWith(term))) prefix.push(loc);
      else if (loc.nameSearch.includes(term)) contains.push(loc);
    }
  } else {
    for (const loc of LOCATIONS){
      const i = loc.search.indexOf(term);
      if (i === 0) prefix.push(loc);
      else if (i > 0) contains.push(loc);
    }
  }
  return exact.concat(prefix, contains);
}

function row(loc){
  const li = document.createElement('li');
  li.className = 'row';

  const num = document.createElement('span');
  num.className = 'num';
  num.textContent = loc.display;

  const nom = document.createElement('span');
  nom.className = 'nom';
  nom.textContent = loc.name;
  nom.title = loc.name;

  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('class', 'ico nav');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('aria-hidden', 'true');
  const path = document.createElementNS(NS, 'path');
  path.setAttribute('d', NAV_PATH);
  svg.append(path);

  const pill = document.createElement('span');
  pill.className = 'pill';
  pill.append(svg);

  // Único elemento pulsable de la fila.
  const a = document.createElement('a');
  a.className = 'go';
  a.href = mapsUrl(loc);
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.setAttribute('aria-label',
    'Navegar a ' + loc.name + ', caseta ' + loc.label + ', ' + loc.street);
  a.append(pill);

  li.append(num, nom, a);
  return li;
}

function render(results){
  const frag = document.createDocumentFragment();
  for (const loc of results) frag.append(row(loc));
  list.replaceChildren(frag);

  const n = results.length;
  body.classList.toggle('no-results', n === 0);
  meta.textContent = n === 0
    ? 'Sin resultados'
    : n + (n === 1 ? ' ubicación' : ' ubicaciones');
}

function update(){
  const v = q.value;
  body.classList.toggle('has-query', v.length > 0);
  render(search(v));
}

q.addEventListener('input', update);
q.addEventListener('search', update);
document.getElementById('clear').addEventListener('click', () => {
  q.value = '';
  update();
  q.focus();
});
q.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ q.value = ''; update(); }
});

update();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
